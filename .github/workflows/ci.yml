name: Build and test
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build both devices
        run: python3 tools/build.py all
      - name: Migration baseline and package boundaries
        run: |
          python3 tools/check_baseline.py
          python3 -m unittest discover -s tests -v
      - name: Device regression suites
        run: python3 tools/run_tests.py all
      - name: Candidate archives
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-packages
          path: dist/
