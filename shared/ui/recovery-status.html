<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恢复进度</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#f5f7fa;color:#17243a;margin:0;padding:24px}main{max-width:640px;margin:8vh auto;background:white;border:1px solid #dce3ed;border-radius:16px;padding:24px}h1{font-size:24px}p{overflow-wrap:anywhere}.muted{color:#617086}a,button{color:#1764b5}button{background:white;border:1px solid #b8c6da;border-radius:8px;padding:9px 16px;font:inherit}</style><main><h1>恢复进度</h1><p id="status" role="status" aria-live="polite">正在查询路由器上的恢复任务…</p><p class="muted">本页独立于被恢复的应用。关闭页面不会取消任务；刷新后会继续查询。等待期间请勿重复恢复或手动重启。</p><p id="detail" class="muted"></p><button id="refresh">重新查询</button>　<a id="back">返回管理页面</a></main><script>
const args=new URLSearchParams(location.hash.slice(1)),id=args.get('id')||'',endpoint=args.get('read')||'',back=args.get('back')||'/',status=document.getElementById('status'),detail=document.getElementById('detail');
if(!/^[a-f0-9]{8}$/.test(id)||!(/^\/cgi-bin\/luci\/[A-Za-z0-9_\/;=.-]+\/read\?kind=recoveryplan$/.test(endpoint)||endpoint==='/custom/sc-recoveryplan.asp'))throw Error('恢复查询地址无效');
document.getElementById('back').href=back.startsWith('/')&&!back.startsWith('//')?back:'/';let timer=null,busy=false;
async function query(){if(busy)return;busy=true;clearTimeout(timer);const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),10000);let finished=false;try{const r=await fetch(endpoint+(endpoint.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:abort.signal});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json();if(p.id!==id)throw Error('暂未取得本次任务记录');const execution=p.execution;if(!execution){status.textContent='正在等待路由器确认任务；如确认凭据已失效，请返回管理页面重新检查备份。'}else{const labels={running:'恢复任务正在路由器上执行，请稍候…',done:'备份恢复完成。',rolledback:'恢复未完成，已自动还原操作前状态。',rejected:'恢复未启动，当前应用未被本次请求覆盖。请返回重新检查备份。',rollback_failed:'自动回退未完成，请保留现场，通过 SSH 检查恢复事务。'};status.textContent=labels[execution.state]||'正在核对任务状态…';finished=['done','rolledback','rejected','rollback_failed'].includes(execution.state);detail.textContent='任务编号 '+id+(execution.time?' · '+new Date(execution.time*1000).toLocaleString('zh-CN',{hour12:false}):'');if(finished)try{localStorage.removeItem('sc-recovery-pending')}catch(_){}}}catch(e){status.textContent='连接暂不可用，正在重连查询；请勿重复提交恢复。';detail.textContent=e.message}finally{clearTimeout(timeout);busy=false;if(!finished)timer=setTimeout(query,3000)}}
document.getElementById('refresh').onclick=query;query();
</script></html>
