<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AX5 · ShellCrash</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#253348;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid #e1e7ef}nav{max-width:1020px;min-height:68px;margin:auto;padding:0 26px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand svg{width:32px;height:32px;color:#087ec2}.brand strong{display:block;font-size:16px;letter-spacing:-.3px}.brand span{display:block;font-size:11px;color:#798494}nav a{color:#798494;text-decoration:none;font-size:13px;padding:23px 0;border-bottom:2px solid transparent}nav a:hover{color:#087ec2}nav a.active{color:#087ec2;border-bottom-color:#087ec2;font-weight:600}.shell{max-width:1020px;margin:18px auto 0;padding:0 12px}#shellcrash-frame{display:block;width:100%;height:640px;border:0}footer{text-align:center;font-size:11px;color:#98a2b1;padding:12px 0 22px}@media(max-width:600px){nav{padding:0 16px;gap:18px;min-height:60px}.brand span{display:none}nav a{font-size:12px;padding:20px 0}.shell{padding:0;margin-top:8px}footer{padding-top:8px}.brand strong{font-size:14px}}header{background:linear-gradient(115deg,#1c62cf,#3882e6);border-bottom:0;color:white}nav{max-width:1160px;min-height:92px;gap:42px}.brand svg{color:white;width:38px;height:38px}.brand strong{font-size:23px;font-weight:500}.brand span{color:#d5e6ff;font-size:12px}nav a{color:#c4dcff;font-size:17px;padding:30px 0}nav a:hover,nav a.active{color:#fff}nav a.active{border-bottom-color:#fff}.shell{max-width:1160px;margin:0 auto;padding:0 12px}body{background:#f5f7fa}footer{color:#8794a8}@media(max-width:600px){nav{min-height:68px;gap:18px}nav a{font-size:13px;padding:23px 0}.brand strong{font-size:18px}.brand svg{width:30px;height:30px}}
</style>
</head><body><header><nav aria-label="路由器导航"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="2" y="9" width="28" height="18" rx="5" fill="currentColor" opacity=".1"/><rect x="5" y="13" width="22" height="11" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M10 13V6m12 7V6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="11" cy="18.5" r="1.3" fill="currentColor"/><circle cx="16" cy="18.5" r="1.3" fill="currentColor"/></svg><div><strong>AX5</strong><span>路由器管理</span></div></div><a href="<%=luci.dispatcher.build_url('web','home')%>">路由状态</a><a href="<%=luci.dispatcher.build_url('web','apsetting','wifi')%>">路由设置</a><a class="active" href="<%=luci.dispatcher.build_url('web','shellcrash')%>" aria-current="page">ShellCrash</a></nav></header>
<main class="shell"><iframe id="shellcrash-frame" title="ShellCrash 管理" src="<%=luci.dispatcher.build_url('web','shellcrash','panel')%>"></iframe></main><footer>AX5 · ShellCrash · 轻量代理管理</footer>
<script>window.addEventListener('message',function(e){if(e.origin===location.origin&&e.source===document.getElementById('shellcrash-frame').contentWindow&&e.data.type==='shellcrash-height'){document.getElementById('shellcrash-frame').style.height=Math.min(6000,Math.max(400,e.data.height))+'px'}})</script>
</body></html>
